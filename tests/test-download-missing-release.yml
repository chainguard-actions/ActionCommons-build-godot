name: Test missing release fails download but sets directory output
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          version: "4.4"
          flavor: rc99
          platform: linuxbsd
          target: template_release
          directory: godot-missing-build
      - name: Assert download failed and directory was created
        env:
          OUTCOME: ${{ steps.action.outcome }}
          DIRECTORY: ${{ steps.action.outputs.directory }}
        run: |
          echo "outcome: $OUTCOME"
          echo "directory: $DIRECTORY"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure downloading non-existent 4.4-rc99"
            exit 1
          fi
          case "$DIRECTORY" in
            /*) ;;
            *) echo "FAIL: directory output should be an absolute path"; exit 1 ;;
          esac
          case "$DIRECTORY" in
            */godot-missing-build) ;;
            *) echo "FAIL: directory output should end with godot-missing-build"; exit 1 ;;
          esac
          if [ ! -d "$DIRECTORY" ]; then
            echo "FAIL: working directory was not created"
            exit 1
          fi
          echo "PASS"
