name: Test custom directory input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create custom build directory
        run: mkdir -p /tmp/godot-custom-build-dir

      - id: action
        uses: .
        continue-on-error: true
        with:
          version: '4.4'
          platform: 'linuxbsd'
          target: 'editor'
          directory: '/tmp/godot-custom-build-dir'
          timeout: '1'

      - name: Assert custom directory was created and used
        run: |
          echo "Checking that the custom directory exists..."
          if [ ! -d "/tmp/godot-custom-build-dir" ]; then
            echo "FAIL: custom directory /tmp/godot-custom-build-dir does not exist"
            exit 1
          fi
          echo "PASS: custom directory exists"

      - name: Assert directory output matches custom path
        env:
          DIR_OUTPUT: ${{ steps.action.outputs.directory }}
        run: |
          echo "directory output: $DIR_OUTPUT"
          if [ "$DIR_OUTPUT" != "/tmp/godot-custom-build-dir" ]; then
            echo "FAIL: expected directory output '/tmp/godot-custom-build-dir', got '$DIR_OUTPUT'"
            exit 1
          fi
          echo "PASS: directory output matches custom path"
