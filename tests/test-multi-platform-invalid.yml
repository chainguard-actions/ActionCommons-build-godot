name: Test multi-platform with one invalid platform
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          version: '4.4'
          platform: 'linuxbsd, badplatform'
          target: 'editor'

      - name: Assert action failed due to invalid platform in list
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when one platform in list is invalid, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed for invalid platform in comma-separated list"
