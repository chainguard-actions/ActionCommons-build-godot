name: Test empty platform input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          version: '4.4'
          flavor: stable
          platform: '   '
          target: editor

      - name: Assert action failed on empty platform
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with empty platform, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed for empty platform"
