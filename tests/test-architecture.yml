name: Test architecture input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create custom build directory
        run: mkdir -p /tmp/godot-arch-test

      - id: action
        uses: .
        with:
          version: "4.4"
          flavor: stable
          platform: linuxbsd
          target: template_release
          architecture: x86_64
          directory: /tmp/godot-arch-test
          timeout: "30"
        continue-on-error: true

      - name: Assert directory output is set
        env:
          ACTUAL: ${{ steps.action.outputs.directory }}
        run: |
          echo "actual directory: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected directory output to be non-empty"
            exit 1
          fi
          echo "PASS: directory output is set to '$ACTUAL'"

      - name: Assert directory matches provided path
        env:
          ACTUAL: ${{ steps.action.outputs.directory }}
        run: |
          if [ "$ACTUAL" != "/tmp/godot-arch-test" ]; then
            echo "FAIL: expected '/tmp/godot-arch-test', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: directory output matches provided path"
