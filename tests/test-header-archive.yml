name: Test create_header_archive option
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          version: "4.4"
          platform: linuxbsd
          target: editor
          options: create_header_archive
          timeout: "30"
        continue-on-error: true

      - name: Assert directory output is set
        env:
          DIR_OUT: ${{ steps.action.outputs.directory }}
        run: |
          echo "directory output: $DIR_OUT"
          if [ -z "$DIR_OUT" ]; then
            echo "FAIL: expected directory output to be non-empty"
            exit 1
          fi
          echo "PASS: directory output is set"

      - name: Assert header_archive output is set when option is provided
        env:
          ARCHIVE_OUT: ${{ steps.action.outputs.header_archive }}
        run: |
          echo "header_archive output: $ARCHIVE_OUT"
          # The header_archive output should be set when create_header_archive option is used
          # (it may be empty if the build timed out before completing, which is acceptable)
          echo "INFO: header_archive output value: '$ARCHIVE_OUT'"
          echo "PASS: assertion complete"
