name: Test invalid timeout input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          version: '4.4'
          flavor: stable
          platform: linuxbsd
          target: editor
          timeout: '-5'

      - name: Assert action failed on negative timeout
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with negative timeout, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed for negative timeout"
