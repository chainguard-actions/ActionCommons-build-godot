name: Test unknown build option is rejected
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          version: "4.4"
          platform: linuxbsd
          target: template_release
          options: |
            create_header_archive
            use_llvm=yes
      - name: Assert action failed during validation
        env:
          OUTCOME: ${{ steps.action.outcome }}
          DIRECTORY: ${{ steps.action.outputs.directory }}
        run: |
          echo "outcome: $OUTCOME"
          echo "directory: $DIRECTORY"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for unknown option 'use_llvm=yes'"
            exit 1
          fi
          if [ -n "$DIRECTORY" ]; then
            echo "FAIL: directory output should not be set when validation fails"
            exit 1
          fi
          echo "PASS"
