name: Test invalid optimize option value
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          version: '4.4'
          platform: linuxbsd
          target: editor
          options: optimize=turbo

      - name: Assert action failed on invalid optimize value
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail for invalid optimize value 'turbo', got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed for invalid optimize value"
